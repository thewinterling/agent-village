[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-village"
version = "0.1.0"
description = "Sims-style live overview of every running Claude Code and Cursor agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.15.0",
]

[project.scripts]
villaged = "agent_village.cli:main"
village-install-hooks = "agent_village.hookinstall:main"
agent-top = "agent_village.top:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# A system-wide ROS install leaks its pytest plugins in through PYTHONPATH and they fail to
# import against this venv's interpreter. We never use them; refuse to autoload them.
addopts = "-p no:launch_testing -p no:launch_ros -p no:ament_lint -p no:ament_pep257 -p no:ament_copyright -p no:ament_xmllint -p no:ament_flake8"

[tool.ruff]
src = ["src", "tests"]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
